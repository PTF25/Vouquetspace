<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvapantallas Radio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{background:radial-gradient(ellipse at 50% 48%,#071b36 0,#020711 55%,#000 100%)}
.nebula{position:absolute;inset:-15%;background:radial-gradient(ellipse at 22% 35%,#172b5a66,transparent 27%),radial-gradient(ellipse at 78% 65%,#004d8050,transparent 30%),radial-gradient(ellipse at 50% 90%,#101d3c44,transparent 30%);animation:neb 45s alternate infinite}
canvas{position:absolute;inset:0;width:100%;height:100%}
.welcome{position:absolute;left:7%;top:50%;transform:translateY(-50%);z-index:3;color:#e8f4ff;font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:.025em;line-height:1.15;text-transform:uppercase;max-width:80vw;text-shadow:0 0 4px #4aa8ff,0 0 12px #168bff,0 0 28px #0755b5}
.welcome .intro{display:block;font-size:clamp(6.67px,1vw,14px);letter-spacing:.16em;color:#dcecff;margin-bottom:6px;text-shadow:0 0 4px #4aa8ff,0 0 12px #168bff}
.welcome .station{display:block;font-size:clamp(12.67px,2.333vw,33.33px);overflow-wrap:anywhere;min-height:1.15em;color:#e8f4ff;text-shadow:0 0 4px #4aa8ff,0 0 12px #168bff,0 0 28px #0755b5}
@keyframes neb{to{transform:translate(2%,1%) scale(1.08)}}
</style></head><body>
<div class="nebula"></div><canvas id="stars"></canvas><canvas id="meteors"></canvas>
<div class="welcome"><span class="intro">Bienvenido a</span><span class="station" id="stationName">Vouquet Radio</span></div>
<script>
// CAMBIA SOLO ESTE TEXTO para personalizar el nombre de la radio:
const RADIO_NAME = "Vouquet Radio";
const station = document.getElementById("stationName");
let charIndex = 0;
function typewriter() {
  station.textContent = RADIO_NAME.slice(0, charIndex);
  if (charIndex < RADIO_NAME.length) {
    charIndex++;
    setTimeout(typewriter, 145);
  } else {
    setTimeout(() => {
      charIndex = 0;
      typewriter();
    }, 5000);
  }
}
typewriter();
const a=document.querySelector('#stars'),x=a.getContext('2d'),b=document.querySelector('#meteors'),y=b.getContext('2d');let W,H,D,S=[],M=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[a,b].forEach(c=>{c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px'});x.setTransform(D,0,0,D,0,0);y.setTransform(D,0,0,D,0,0);S=Array.from({length:Math.floor(W*H/330)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.2,p:Math.random()*6,s:.5+Math.random()*2}))}
function stars(t){x.clearRect(0,0,W,H);S.forEach(q=>{let z=.15+.85*(.5+.5*Math.sin(t*.001*q.s+q.p));x.fillStyle=`rgba(210,235,255,${z})`;x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fill()});requestAnimationFrame(stars)}
function spawn(){M.push({x:Math.random()*W*.85,y:-20,v:5+Math.random()*8,l:90+Math.random()*170,o:1});setTimeout(spawn,650+Math.random()*2200)}
function meteors(){y.clearRect(0,0,W,H);M.forEach((q,i)=>{q.x+=q.v;q.y+=q.v*.65;q.o-=.012;let g=y.createLinearGradient(q.x,q.y,q.x-q.l,q.y-q.l*.65);g.addColorStop(0,`rgba(255,255,255,${Math.max(0,q.o)})`);g.addColorStop(1,'rgba(70,170,255,0)');y.strokeStyle=g;y.lineWidth=2;y.beginPath();y.moveTo(q.x,q.y);y.lineTo(q.x-q.l,q.y-q.l*.65);y.stroke();if(q.o<=0)M.splice(i,1)});requestAnimationFrame(meteors)}
addEventListener('resize',resize);resize();requestAnimationFrame(stars);requestAnimationFrame(meteors);spawn();
</script></body></html>
